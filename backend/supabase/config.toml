# Proyecto de Supabase del servidor de Subo.
# Solo se declara lo que difiere de los valores por defecto de la CLI.
project_id = "expresdm"

[db]
major_version = 17

[db.seed]
# El catálogo inicial va en una migración, no en seed.sql: así llega también a
# producción con `supabase db push`, no solo a la base local.
enabled = false

[functions.server]
# La app no usa Supabase Auth: manda su propio token de sesión (JWT firmado con
# JWT_SECRET) y lo comprueba la función. Si la pasarela lo verificara como token
# de Supabase, lo rechazaría antes de llegar a la función.
verify_jwt = false
